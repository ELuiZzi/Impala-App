[package]
name = "impala-desktop"
version = "1.7.0"
description = "Impala para PC"
edition = "2021"

[lib]
name = "impala_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers: deja mandar Origin y User-Agent propios (YouTube los exige; ver app/src/api/innertube.ts).
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
reqwest = { version = "0.13", features = ["stream", "multipart"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
md-5 = "0.10"
lofty = "0.25"
notify = "8"
trash = "5"
dirs = "6"
keyring = { version = "3.6", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
